name: Azure CI CD DOCKER
run-name: Deploy en Azure v${{ github.run_number }} - by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
env:
  IMAGE_NAME: skoolapp.azurecr.io/repo/appimg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build an image from Dockerfile
        run: docker build -t app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'app:${{ github.sha }}'
          output: report.json
          format: 'json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: report.json
          archive: false

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: skoolapp.azurecr.io
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BUILD_TAG=v${{ github.run_number }}
          tags: |
            ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest
          push: true
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: dockercicd
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
